services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      bash -c "ollama serve & sleep 5 && ollama pull llama3.2:1b && tail -f /dev/null"

  search-server:
    build: .
    container_name: search-server
    ports:
      - "8080:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      DATA_DIR: /app/data
      JAVA_TOOL_OPTIONS: -Xmx4g
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - ollama

volumes:
  ollama_data: